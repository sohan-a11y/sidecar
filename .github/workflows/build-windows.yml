name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main (Electron Forge Vite)
        run: npm run package

      - name: Setup MSVC (Visual Studio Developer Command Prompt)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile C++ Stealth Loader
        run: |
          cl.exe /EHsc /std:c++20 /O2 stealth_loader.cpp vendor/minhook/libMinHook.x64.lib /Fe:WindowsAudioDeviceGraph.exe /link user32.lib d3d11.lib dxgi.lib
        shell: cmd

      - name: Prepare Final Binaries for Packaging
        run: |
          move WindowsAudioDeviceGraph.exe out/package/win32-unpacked/

      - name: Make Windows Installer (NSIS)
        run: npm run make

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows-installer
          path: out/make/**/*.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/make/**/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
